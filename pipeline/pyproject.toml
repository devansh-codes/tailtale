[project]
name = "tailtale-pipeline"
version = "0.1.0"
description = "TailTale daily ETL: FAA registry and ADSB.lol history to static JSON shards"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.6",
    "numpy==2.5.4",
    "orjson==3.13.0",
    "polars==1.44.2",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==6.3.0",
    "ruff==0.17.0",
]
notebooks = [
    "ipykernel==6.31.0",
    "jupyter==1.1.1",
    "matplotlib==3.11.2",
    "nbconvert==7.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM115"]
