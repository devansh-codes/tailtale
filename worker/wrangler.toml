name = "jetlog-api"
main = "src/index.ts"
compatibility_date = "2026-10-15"
workers_dev = true

[vars]
PAGES_ORIGIN = "https://jetlog.pages.dev"
REPO_URL = "https://github.com/devansh-codes/tailtale"
EXTRA_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

[[d1_databases]]
binding = "DB"
database_name = "tailtale"
database_id = "b1ec9515-0c58-44f6-8e00-8d58716d2064"
migrations_dir = "migrations"

[triggers]
# Retired: ADSB.lol refuses Cloudflare egress IPs, so .github/workflows/live.yml (GitHub Actions, every ~10 min)
# writes the type counts and the live snapshot to D1 instead. runCron() remains for if that ever changes.
crons = []

[observability]
enabled = true
