name: Live snapshot

# ADSB.lol refuses most requests from Cloudflare's IPs, so live data is fetched here instead: one combined
# /v2/type request for the 40 tracked airliner types (~7,000 aircraft), written to D1 for the API to read.
# GitHub may start scheduled runs late; the site labels every live value with the snapshot time.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: live-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline
            worker/wrangler.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet orjson==3.13.0
      - name: Snapshot ADSB.lol into D1
        working-directory: pipeline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAILTALE_REPO_URL: https://github.com/${{ github.repository }}
        run: python live_snapshot.py
